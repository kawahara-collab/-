<!--
  お問い合わせフォーム送信の計測（Google広告「フォーム送信」コンバージョン）
  貼り付け先：グーペ管理画面 → ナビゲーションパーツ（電話タップ計測のコードと同じ場所）の末尾に追加
  事前準備：Google広告で「フォーム送信」のコンバージョン アクションを「手動でコードを使って設定」で作り、
           表示される送信先（AW-797252503/xxxxxxxx）の「/」以降で FORM_LABEL を置き換える

  しくみ：送信後の完了ページは、フォームと同じ https://kawahara1.com/contact/ のため、URLでは区別できない。
         /contact のページに「お問合わせありがとうございました」の文字が出たときだけ、成果を1回送る。
-->
<script>
(function(){
  var SEND_TO = 'AW-797252503/FORM_LABEL';
  function check(){
    if (location.pathname.indexOf('/contact') !== 0) return;
    var text = document.body ? (document.body.innerText || document.body.textContent || '') : '';
    if (text.indexOf('お問合わせありがとうございました') === -1 && text.indexOf('メールを送信いたしました') === -1) return;
    if (typeof gtag === 'function') {
      gtag('event', 'conversion', { 'send_to': SEND_TO });
    }
  }
  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', check); } else { check(); }
})();
</script>
