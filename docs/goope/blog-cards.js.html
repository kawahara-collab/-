<script>/* KW 2026-10-23 ブログ一覧を写真入りのカード形式に（記事ページ /diary/数字 では何もしない） */(function(){function f(){if(/^\/diary\/\d+\/?$/.test(location.pathname))return;var w=document.querySelector('.p-diary');if(!w)return;var u=w.querySelectorAll('.p-diary__unit');if(!u.length)return;for(var i=0;i<u.length;i++){var s=u[i],b=s.querySelector('.p-diary__body');if(!b)continue;var im=b.querySelector('img'),t=document.createElement('div');t.className='kw-card-thumb'+(im?'':' is-empty');if(im){t.style.backgroundImage='url("'+(im.getAttribute('src')||'')+'")';}s.insertBefore(t,s.firstChild);var dt=s.querySelector('.p-diary__date');if(dt){var mm=dt.textContent.match(/(\d\d\d\d)-(\d\d)-(\d\d)/);if(mm)dt.textContent=mm[1]+'年'+(+mm[2])+'月'+(+mm[3])+'日';}var c=b.cloneNode(true),r=c.querySelectorAll('.kw-doc-note,.kw-doc-cta,.kw-doc-related,script,style');for(var j=0;j<r.length;j++)r[j].parentNode.removeChild(r[j]);var x=(c.textContent||'').replace(/\s+/g,' ').trim();if(x.length>90)x=x.slice(0,90)+'…';var e=document.createElement('p');e.className='kw-card-excerpt';e.textContent=x;s.appendChild(e);var m=document.createElement('div');m.className='kw-card-more';m.textContent='続きを読む →';s.appendChild(m);}document.body.className+=' kw-diary-list';}if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',f);}else{f();}})();</script>
