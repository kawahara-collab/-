<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;background:#eef2f6}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f6f9"/><stop offset="1" stop-color="#e3e9f0"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#13253d" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <!-- ground -->
  <ellipse cx="600" cy="600" rx="520" ry="38" fill="#d5dde7"/>
  <!-- bank building -->
  <g transform="translate(110,150)" filter="url(#sh)">
    <polygon points="0,110 210,20 420,110" fill="#1d3557"/>
    <rect x="20" y="110" width="380" height="26" fill="#2b4a72"/>
    <g fill="#f7f8f9">
      <rect x="50" y="150" width="34" height="230"/><rect x="128" y="150" width="34" height="230"/>
      <rect x="258" y="150" width="34" height="230"/><rect x="336" y="150" width="34" height="230"/>
    </g>
    <rect x="186" y="230" width="48" height="150" rx="24" fill="#2b4a72"/>
    <rect x="0" y="380" width="420" height="28" fill="#1d3557"/>
    <rect x="-20" y="408" width="460" height="22" fill="#2b4a72"/>
    <circle cx="210" cy="78" r="18" fill="#a4673a"/>
  </g>
  <!-- passbook -->
  <g transform="translate(620,170) rotate(-6)" filter="url(#sh)">
    <rect x="0" y="0" width="300" height="400" rx="14" fill="#a4673a"/>
    <rect x="12" y="12" width="276" height="376" rx="10" fill="none" stroke="#c99a74" stroke-width="2"/>
    <rect x="60" y="70" width="180" height="20" rx="4" fill="#e8d3bf"/>
    <rect x="90" y="108" width="120" height="12" rx="4" fill="#e8d3bf" opacity=".8"/>
    <rect x="40" y="300" width="220" height="10" rx="4" fill="#c99a74"/>
    <rect x="40" y="322" width="160" height="10" rx="4" fill="#c99a74"/>
  </g>
  <!-- open passbook page (rows) -->
  <g transform="translate(830,250) rotate(4)" filter="url(#sh)">
    <rect x="0" y="0" width="250" height="320" rx="10" fill="#ffffff"/>
    <g stroke="#d9dee4" stroke-width="2">
      <line x1="20" y1="60" x2="230" y2="60"/><line x1="20" y1="100" x2="230" y2="100"/><line x1="20" y1="140" x2="230" y2="140"/>
      <line x1="20" y1="180" x2="230" y2="180"/><line x1="20" y1="220" x2="230" y2="220"/><line x1="20" y1="260" x2="230" y2="260"/>
      <line x1="90" y1="30" x2="90" y2="290"/><line x1="160" y1="30" x2="160" y2="290"/>
    </g>
    <g fill="#9aa6b4"><rect x="100" y="72" width="50" height="12" rx="3"/><rect x="170" y="112" width="50" height="12" rx="3"/><rect x="100" y="152" width="44" height="12" rx="3"/><rect x="170" y="192" width="54" height="12" rx="3"/></g>
  </g>
  <!-- lock badge -->
  <g transform="translate(985,190)" filter="url(#sh)">
    <circle cx="0" cy="0" r="62" fill="#1d3557"/>
    <path d="M-20,-8 v-14 a20,20 0 0 1 40,0 v14" fill="none" stroke="#f7f8f9" stroke-width="9" stroke-linecap="round"/>
    <rect x="-30" y="-10" width="60" height="44" rx="8" fill="#f7f8f9"/>
    <circle cx="0" cy="10" r="7" fill="#1d3557"/><rect x="-3" y="12" width="6" height="12" fill="#1d3557"/>
  </g>
  <!-- seal (hanko) -->
  <g transform="translate(575,590)">
    <rect x="-18" y="-80" width="36" height="80" rx="10" fill="#f0e6da"/>
    <ellipse cx="0" cy="0" rx="26" ry="10" fill="#b5413a"/>
  </g>
  <!-- cash card -->
  <g transform="translate(760,505) rotate(-8)" filter="url(#sh)">
    <rect x="-170" y="0" width="190" height="120" rx="12" fill="#2b4a72"/>
    <rect x="-150" y="28" width="38" height="28" rx="5" fill="#e3c27a"/>
    <rect x="-150" y="80" width="140" height="10" rx="4" fill="#9fb3cc"/>
  </g>
</svg></body></html>
