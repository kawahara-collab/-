<script>/* KW 2026-10-23 ヘッダーの説明文を、言葉の途中で改行しない（。、・の後でだけ改行） */(function(){function f(){var d=document.querySelector('.site_description');if(!d||d.querySelector('span'))return;var t=d.textContent.replace(/^\s+|\s+$/g,'');var p=t.match(/[^。、・]+[。、・]?/g);if(!p)return;d.innerHTML='';for(var i=0;i<p.length;i++){var e=document.createElement('span');e.style.display='inline-block';e.textContent=p[i];d.appendChild(e);}}if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',f);}else{f();}})();</script>
