<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<!-- LINEリッチメニュー画像（大・4分割 2500×1686）。Playwrightで richmenu.png に書き出す -->
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --ai:#1d3557; --kaki:#a4673a; --paper:#f7f8f9; --ink:#16212e; --line:#d9dee4; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { width:2500px; height:1686px; font-family:"Zen Kaku Gothic New",sans-serif; background:var(--line); }
  .grid { display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:8px; width:100%; height:100%; }
  .c { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:40px; background:#fff; color:var(--ink); text-align:center; }
  .c.tel { background:var(--ai); color:#fff; }
  .c svg { width:230px; height:230px; }
  .t { font-size:132px; font-weight:900; letter-spacing:.04em; line-height:1.15; }
  .s { font-size:64px; font-weight:500; color:#55606d; line-height:1.3; }
  .tel .s { color:#dfe6ef; }
</style></head>
<body><div class="grid">
  <div class="c tel">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
    <div class="t">電話で相談</div>
    <div class="s">092-807-2948<br>平日 9:00–12:00 / 13:00–17:00</div>
  </div>
  <div class="c">
    <svg viewBox="0 0 24 24" fill="none" stroke="#a4673a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M8.5 7l3.5 5 3.5-5M12 12v6M8.5 13h7M8.5 15.8h7"/></svg>
    <div class="t">費用について</div>
    <div class="s">相談料・申立ての費用・報酬</div>
  </div>
  <div class="c">
    <svg viewBox="0 0 24 24" fill="none" stroke="#a4673a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5.5A1.5 1.5 0 0 1 3.5 4H9a3 3 0 0 1 3 3v13a2.5 2.5 0 0 0-2.5-2.5H2z"/><path d="M22 5.5A1.5 1.5 0 0 0 20.5 4H15a3 3 0 0 0-3 3v13a2.5 2.5 0 0 1 2.5-2.5H22z"/></svg>
    <div class="t">成年後見ガイド</div>
    <div class="s">制度・手続きの流れ・よくある質問</div>
  </div>
  <div class="c">
    <svg viewBox="0 0 24 24" fill="none" stroke="#a4673a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21.5s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9.5" r="2.6"/></svg>
    <div class="t">事務所の場所</div>
    <div class="s">JR周船寺駅から徒歩7分</div>
  </div>
</div></body></html>
